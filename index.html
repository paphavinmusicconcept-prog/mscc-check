<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSCC Check</title>
  <style>
    :root {
      color-scheme: light;
      --red:#e63946;
      --paper:#f1faee;
      --mint:#a8dadc;
      --blue:#457b9d;
      --navy:#1d3557;
      --surface:#fbfffa;
      --surface-2:#eaf6f3;
      --text:#172f4d;
      --muted:#587089;
      --faint:#7f92a3;
      --line:rgba(29,53,87,.14);
      --line-strong:rgba(29,53,87,.24);
      --shadow:0 18px 45px rgba(29,53,87,.08);
      --radius:8px;
    }
    * { box-sizing:border-box; }
    html { background:var(--paper); }
    body {
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg, #f7fff5 0%, var(--paper) 44%, #e8f5f3 100%);
    }
    button, input { font:inherit; }
    .wrap { width:calc(100% - 32px); max-width:1040px; margin:0 auto; padding:22px 0 36px; }
    .topbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:10px 0 18px;
    }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }
    .brand-mark {
      display:grid;
      place-items:center;
      width:133px;
      height:44px;
      overflow:visible;
    }
    .brand-mark img {
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
    }
    .brand-text { min-width:0; }
    .brand-text strong { display:block; font-size:17px; line-height:1.15; color:var(--navy); }
    .brand-text span { display:block; margin-top:2px; color:var(--muted); font-size:13px; }
    .meta-stack { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px; }
    .badge {
      display:inline-flex;
      align-items:center;
      min-height:30px;
      padding:6px 10px;
      border-radius:8px;
      border:1px solid var(--line);
      background:rgba(251,255,250,.78);
      color:var(--muted);
      font-size:12px;
      font-weight:750;
      white-space:nowrap;
    }
    .layout { display:grid; grid-template-columns:minmax(0, 1fr) 292px; gap:14px; align-items:start; }
    main, aside { min-width:0; }
    .search-panel, .summary-panel, .results-panel {
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(251,255,250,.92);
      box-shadow:var(--shadow);
    }
    .search-panel { padding:18px; }
    .summary-panel { padding:12px; position:sticky; top:16px; }
    .results-panel { margin-top:14px; padding:16px; }
    .page-title { margin:0 0 14px; color:var(--navy); font-size:24px; line-height:1.2; letter-spacing:0; }
    .search { display:grid; grid-template-columns:minmax(0, 1fr) auto auto; gap:8px; align-items:center; }
    input {
      width:100%;
      min-width:0;
      height:44px;
      padding:0 13px;
      border:1px solid var(--line-strong);
      border-radius:8px;
      background:var(--surface);
      color:var(--navy);
      font-size:16px;
      line-height:1;
      outline:none;
      box-shadow:0 1px 0 rgba(29,53,87,.04);
    }
    input::placeholder { color:#8497a8; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(69,123,157,.18); }
    button, .link {
      min-height:44px;
      border-radius:8px;
      padding:0 14px;
      border:1px solid transparent;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      color:inherit;
      text-decoration:none;
      font-weight:800;
      cursor:pointer;
      transition:background .18s ease-out, border-color .18s ease-out, transform .18s ease-out;
      white-space:nowrap;
    }
    button:hover, .link:hover { transform:translateY(-1px); }
    button:focus-visible, .link:focus-visible { outline:3px solid rgba(69,123,157,.22); outline-offset:2px; }
    button:disabled { opacity:.48; cursor:not-allowed; transform:none; }
    .primary { background:var(--blue); color:var(--paper); border-color:var(--blue); }
    .primary:hover { background:var(--navy); border-color:var(--navy); }
    .secondary, .ghost {
      background:var(--surface);
      color:var(--navy);
      border-color:var(--line);
    }
    .secondary:hover, .ghost:hover { background:var(--surface-2); border-color:var(--line-strong); }
    .summary-grid { display:grid; gap:8px; }
    .stat {
      min-height:82px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--surface);
    }
    .label {
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      line-height:1.2;
      text-transform:uppercase;
      letter-spacing:0;
    }
    .value { margin-top:7px; color:var(--navy); font-size:17px; font-weight:750; line-height:1.35; overflow-wrap:anywhere; }
    .value.large { font-size:30px; line-height:1.05; letter-spacing:0; }
    .sku-card { font-size:14px; letter-spacing:0; }
    .name-card { font-size:18px; font-weight:850; line-height:1.25; }
    .section-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }
    .section-title { color:var(--navy); font-size:15px; font-weight:850; }
    .status {
      display:inline-flex;
      align-items:center;
      min-height:30px;
      padding:6px 10px;
      border-radius:8px;
      border:1px solid var(--line);
      background:var(--surface-2);
      color:var(--blue);
      font-size:13px;
      font-weight:800;
    }
    .status.ok { border-color:rgba(69,123,157,.25); background:rgba(168,218,220,.42); color:var(--navy); }
    .status.empty { border-color:rgba(230,57,70,.2); background:rgba(230,57,70,.08); color:var(--red); }
    .error {
      margin-top:10px;
      padding:11px 12px;
      border-radius:8px;
      border:1px solid rgba(230,57,70,.28);
      background:rgba(230,57,70,.08);
      color:#a9212d;
      line-height:1.5;
      overflow-wrap:anywhere;
    }
    .result-list { display:grid; gap:8px; }
    .result-card {
      min-width:0;
      padding:13px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--surface);
    }
    .result-sku { color:var(--blue); font-size:13px; font-weight:850; line-height:1.2; letter-spacing:0; }
    .result-name {
      margin-top:6px;
      color:var(--navy);
      font-size:20px;
      font-weight:900;
      line-height:1.2;
      letter-spacing:0;
      text-transform:uppercase;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    .stock-chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
    .stock-chip {
      display:inline-flex;
      align-items:center;
      min-height:32px;
      max-width:100%;
      padding:6px 10px;
      border-radius:8px;
      background:var(--surface-2);
      border:1px solid rgba(69,123,157,.16);
      color:var(--navy);
      font-size:14px;
      font-weight:800;
      line-height:1.2;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    .load-more-row {
      display:grid;
      justify-items:center;
      gap:6px;
      margin-top:12px;
      padding-top:4px;
    }
    .load-more-button {
      min-width:140px;
      background:var(--surface);
      color:var(--navy);
      border-color:var(--line);
    }
    .load-more-button:hover { background:var(--surface-2); border-color:var(--line-strong); }
    .meta { color:var(--faint); font-size:12px; margin-top:10px; line-height:1.5; }
    .count-label { margin-bottom:10px; color:var(--muted); font-size:13px; line-height:1.5; }
    .warehouse-list { display:grid; gap:7px; margin-top:8px; }
    .warehouse-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:40px;
      padding:9px 10px;
      border:1px solid var(--line);
      border-radius:8px;
      background:var(--surface);
    }
    .warehouse-row strong { color:var(--navy); font-size:14px; font-weight:850; line-height:1.25; overflow-wrap:anywhere; }
    .warehouse-row span { flex:0 0 auto; color:var(--blue); font-weight:850; font-size:14px; }
    @media (max-width:840px) {
      .wrap { width:calc(100% - 24px); max-width:1040px; padding-top:14px; }
      .topbar { align-items:flex-start; flex-direction:column; gap:10px; padding-bottom:14px; }
      .meta-stack { justify-content:flex-start; }
      .layout { display:flex; flex-direction:column; }
      main { display:contents; }
      .search-panel { order:1; }
      .summary-panel { order:2; }
      .results-panel { order:3; }
      .search-panel, .summary-panel, .results-panel { width:100%; }
      .summary-panel { position:static; }
      .summary-grid { grid-template-columns:repeat(3, minmax(0, 1fr)); }
      .results-panel { margin-top:12px; }
    }
    @media (max-width:620px) {
      .search { grid-template-columns:1fr; }
      button, .link { width:100%; }
      .summary-panel { padding:8px; }
      .summary-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px; }
      .stat { min-width:0; min-height:72px; padding:9px 6px; }
      .stat:nth-child(3) { grid-column:1 / -1; min-height:68px; }
      .stat .label { font-size:10px; line-height:1.15; }
      .stat .value {
        min-width:0;
        font-size:13px;
        line-height:1.25;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .stat .value.large { font-size:22px; }
      .name-card {
        display:-webkit-box;
        overflow:hidden;
        -webkit-line-clamp:2;
        -webkit-box-orient:vertical;
      }
      .page-title { font-size:21px; }
      .result-name { font-size:18px; }
      .warehouse-row { align-items:flex-start; flex-direction:column; gap:5px; }
      .warehouse-row span { flex:auto; }
    }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <img src="/assets/bigtone-logo-transparent.png" alt="Bigtone" />
        </div>
        <div class="brand-text">
          <strong>MSCC Check</strong>
          <span>ค้นหาสต็อกจาก SKU หรือชื่อสินค้า</span>
        </div>
      </div>
      <div class="meta-stack">
        <div id="source-badge" class="badge">แหล่งข้อมูล: %%INITIAL_SOURCE_LABEL%%</div>
        <div id="updated-badge" class="badge">อัปเดต: %%INITIAL_UPDATED_AT%%</div>
      </div>
    </header>

    <div class="layout">
      <main>
        <section class="search-panel" aria-labelledby="search-title">
          <h1 id="search-title" class="page-title">เช็คสต็อกสินค้า</h1>
          <form class="search" id="search-form">
            <input id="query" name="query" placeholder="พิมพ์ SKU หรือชื่อสินค้า" value="%%INITIAL_SKU%%" autocomplete="off" spellcheck="false" />
            <button class="primary" type="submit">ค้นหา</button>
            <a class="link secondary" href="/">ล้าง</a>
          </form>
          <div id="error-slot"></div>
        </section>

        <section class="results-panel" aria-labelledby="result-title">
          <div class="section-head">
            <div id="result-title" class="section-title">รายละเอียดคลัง</div>
          </div>
          <div id="result-slot"></div>
        </section>
      </main>

      <aside class="summary-panel" aria-label="สรุปผลค้นหา">
        <div class="summary-grid">
          <div class="stat">
            <div class="label">Available Stock</div>
            <div class="value large" id="available-stock">-</div>
          </div>
          <div class="stat">
            <div class="label">SKU</div>
            <div class="value" id="sku-value">-</div>
          </div>
          <div class="stat">
            <div class="label">ชื่อสินค้า</div>
            <div class="value" id="name-value">-</div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const initialResult = %%INITIAL_RESULT%%;
    const initialError = "%%INITIAL_ERROR%%";
    const initialSource = "%%INITIAL_SOURCE%%";
    const initialUpdatedAt = "%%INITIAL_UPDATED_AT%%";
    const liffId = "%%LIFF_ID%%";
    const form = document.getElementById('search-form');
    const queryInput = document.getElementById('query');
    const skuValue = document.getElementById('sku-value');
    const nameValue = document.getElementById('name-value');
    const availableStock = document.getElementById('available-stock');
    const resultSlot = document.getElementById('result-slot');
    const errorSlot = document.getElementById('error-slot');
    const sourceBadge = document.getElementById('source-badge');
    const updatedBadge = document.getElementById('updated-badge');
    let currentQuery = queryInput.value || '';
    let currentPage = 1;
    let currentTotalPages = 1;
    let isLoadingMore = false;
    let loadMoreObserver = null;

    const loadingText = initialSource === 'github' ? 'กำลังโหลดจาก GitHub...' : 'กำลังโหลดข้อมูล...';

    async function initLiff() {
      if (!liffId || !window.liff) return;
      try {
        await liff.init({ liffId });
      } catch (error) {
        errorSlot.innerHTML = `<div class="error">${escapeHtml(error.message || 'LIFF init failed')}</div>`;
      }
    }

    function setSourceBadge(source) {
      const label = String(source || '').toLowerCase() === 'github' ? 'GitHub' : 'Local';
      sourceBadge.textContent = `แหล่งข้อมูล: ${label}`;
    }

    function setUpdatedBadge(value) {
      updatedBadge.textContent = `อัปเดต: ${value || '-'}`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderEmpty(message) {
      skuValue.className = 'value';
      nameValue.className = 'value';
      skuValue.textContent = '-';
      nameValue.textContent = '-';
      availableStock.textContent = '-';
      resultSlot.innerHTML = '<div class="status empty">ยังไม่มีผลลัพธ์</div>';
      errorSlot.innerHTML = message ? `<div class="error">${escapeHtml(message)}</div>` : '';
    }

    function renderMatchCard(item) {
      return `
        <div class="result-card">
          <div class="result-sku">${escapeHtml(item.sku || '-')}</div>
          <div class="result-name">${escapeHtml(item.name || '-')}</div>
          <div class="stock-chips">${renderStockChips(item.branches || [])}</div>
        </div>
      `;
    }

    function updateResultCount(total) {
      const label = document.getElementById('result-count-label');
      const list = document.getElementById('result-list');
      if (!label || !list) return;
      const shown = list.querySelectorAll('.result-card').length;
      label.textContent = `แสดง ${shown} จากทั้งหมด ${total} รายการ`;
    }

    function renderLoadMore(data) {
      const page = Number(data.page || 1);
      const totalPages = Number(data.total_pages || 1);
      const total = Number(data.total_matches || data.matches?.length || 0);
      if (page >= totalPages) return `<div class="meta">แสดงครบ ${total} รายการ</div>`;
      return `
        <div class="load-more-row">
          <button class="load-more-button" type="button" data-load-more>โหลดเพิ่ม</button>
          <div class="meta">เลื่อนลงเพื่อโหลดรายการถัดไป</div>
        </div>
      `;
    }

    function observeLoadMore() {
      if (loadMoreObserver) loadMoreObserver.disconnect();
      const button = resultSlot.querySelector('[data-load-more]');
      if (!button || !('IntersectionObserver' in window)) return;
      loadMoreObserver = new IntersectionObserver((entries) => {
        if (entries.some((entry) => entry.isIntersecting)) loadMoreResults();
      }, { rootMargin: '240px 0px' });
      loadMoreObserver.observe(button);
    }

    function renderWarehouseList(items) {
      const rows = (items || []).flatMap((branch) => {
        const warehouses = Array.isArray(branch.warehouses) ? branch.warehouses : [];
        if (warehouses.length) {
          return warehouses.map((warehouse) => `
            <div class="warehouse-row">
              <strong>${escapeHtml(branch.branch || '-')} · ${escapeHtml(warehouse.warehouse || '-')}</strong>
              <span>${Number(warehouse.stock || 0)} ตัว</span>
            </div>
          `);
        }
        return `
          <div class="warehouse-row">
            <strong>${escapeHtml(branch.branch || '-')} · ${escapeHtml(branch.warehouse || '-')}</strong>
            <span>${Number(branch.stock || 0)} ตัว</span>
          </div>
        `;
      });

      return rows.join('');
    }

    function stockLabel(branch) {
      if (branch.label) return branch.label;
      const warehouse = String(branch.warehouse || '');
      if (branch.branch === 'MSCC') return warehouse || 'MSCC';
      if (branch.branch === 'BEH') return warehouse || 'BEH';
      if (branch.branch === '01') return 'หน้าร้าน';
      if (branch.branch === '02') return 'ใบยืม';
      if (branch.branch === '03') return 'รออะไหล่/เสีย';
      if (branch.branch === '04') return 'ฝากขาย';
      if (branch.branch === '05') return 'จอง';
      if (branch.branch === '06') return 'คลังฝาก';
      if (warehouse.includes('คลังฝาก') || branch.branch === '06') return 'คลังฝาก';
      return branch.branch || warehouse || '-';
    }

    function renderStockChips(items) {
      const chips = (items || []).map((branch) => `
        <div class="stock-chip">${escapeHtml(stockLabel(branch))}: ${Number(branch.stock || 0)} ตัว</div>
      `);
      return chips.join('') || '<div class="stock-chip">ไม่มีสต็อก</div>';
    }

    function renderResult(data) {
      setSourceBadge(data.source || initialSource);
      setUpdatedBadge(data.updated_at ? new Date(data.updated_at).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' }) : initialUpdatedAt);
      if (data.matches && data.matches.length > 1) {
        const total = Number(data.total_matches || data.matches.length);
        const shown = Number(data.shown_matches || data.matches.length);
        const page = Number(data.page || 1);
        const totalPages = Number(data.total_pages || 1);
        currentPage = page;
        currentTotalPages = totalPages;
        skuValue.className = 'value';
        nameValue.className = 'value';
        skuValue.textContent = data.query || '-';
        nameValue.textContent = `${total} รายการ`;
        availableStock.textContent = `${total} รายการ`;
        resultSlot.innerHTML = `
          <div class="status ok">พบหลายสินค้า</div>
          <div id="result-count-label" class="count-label">แสดง ${shown} จากทั้งหมด ${total} รายการ</div>
          <div id="result-list" class="result-list">
            ${data.matches.map(renderMatchCard).join('')}
          </div>
          ${renderLoadMore(data)}`;
        observeLoadMore();
        return;
      }

      skuValue.textContent = data.sku || '-';
      skuValue.className = 'value sku-card';
      nameValue.className = 'value name-card';
      skuValue.textContent = data.sku || '-';
      nameValue.textContent = data.name || '-';
      availableStock.textContent = `${Number(data.available_stock || 0)} ตัว`;
      resultSlot.innerHTML = `
        <div class="status ok">พบสินค้า</div>
        <div class="result-card">
          <div class="result-sku">${escapeHtml(data.sku || '-')}</div>
          <div class="result-name">${escapeHtml(data.name || '-')}</div>
          <div class="stock-chips">${renderStockChips(data.branches || [])}</div>
        </div>
        ${(data.branches || []).length ? '' : '<div class="meta">ไม่มีรายละเอียดคลัง</div>'}
      `;
    }

    async function runSearch(query, page = 1) {
      const value = String(query || '').trim();
      if (!value) {
        renderEmpty('กรุณาพิมพ์ SKU หรือชื่อสินค้าก่อน');
        return;
      }

      errorSlot.innerHTML = '';
      resultSlot.innerHTML = `<div class="status">${escapeHtml(loadingText)}</div>`;

      const response = await fetch(`/search?sku=${encodeURIComponent(value)}&page=${encodeURIComponent(page)}`);
      const payload = await response.json();
      if (!response.ok) {
        renderEmpty(payload.message || 'ไม่พบสินค้า');
        return;
      }

      currentQuery = value;
      currentPage = Number(payload.page || 1);
      renderResult(payload);
      history.replaceState({}, '', `/?sku=${encodeURIComponent(value)}&page=${currentPage}`);
    }

    async function loadMoreResults() {
      if (isLoadingMore || !currentQuery || currentPage >= currentTotalPages) return;
      isLoadingMore = true;
      const button = resultSlot.querySelector('[data-load-more]');
      if (button) {
        button.disabled = true;
        button.textContent = 'กำลังโหลด...';
      }
      try {
        const nextPage = currentPage + 1;
        const response = await fetch(`/search?sku=${encodeURIComponent(currentQuery)}&page=${encodeURIComponent(nextPage)}`);
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.message || 'โหลดเพิ่มไม่สำเร็จ');
        const list = document.getElementById('result-list');
        if (!list || !Array.isArray(payload.matches)) return;
        list.insertAdjacentHTML('beforeend', payload.matches.map(renderMatchCard).join(''));
        currentPage = Number(payload.page || nextPage);
        currentTotalPages = Number(payload.total_pages || currentTotalPages);
        updateResultCount(Number(payload.total_matches || list.querySelectorAll('.result-card').length));
        const loadMoreRow = resultSlot.querySelector('.load-more-row');
        if (loadMoreRow) loadMoreRow.outerHTML = renderLoadMore(payload);
        observeLoadMore();
        history.replaceState({}, '', `/?sku=${encodeURIComponent(currentQuery)}&page=${currentPage}`);
      } catch (error) {
        if (button) {
          button.disabled = false;
          button.textContent = 'ลองโหลดอีกครั้ง';
        }
        errorSlot.innerHTML = `<div class="error">${escapeHtml(error.message || 'โหลดเพิ่มไม่สำเร็จ')}</div>`;
      } finally {
        isLoadingMore = false;
      }
    }

    resultSlot.addEventListener('click', (event) => {
      const loadMoreButton = event.target.closest('[data-load-more]');
      if (loadMoreButton) {
        loadMoreResults();
        return;
      }
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      currentPage = 1;
      runSearch(queryInput.value, 1).catch((error) => renderEmpty(error.message || 'เกิดข้อผิดพลาด'));
    });

    if (initialError) errorSlot.innerHTML = `<div class="error">${escapeHtml(initialError)}</div>`;
    if (initialResult) renderResult(initialResult);
    else {
      setSourceBadge(initialSource);
      setUpdatedBadge(initialUpdatedAt);
      renderEmpty('');
    }

    initLiff();
  </script>
</body>
</html>
